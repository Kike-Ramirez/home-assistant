services:
  telegram-adapter:
    image: kikeramirez/home-assistant-telegram-adapter:latest
    networks:
      - barbaraServices

  web-adapter:
    image: kikeramirez/home-assistant-web-adapter:latest
    ports:
      - "8090:8090"
    networks:
      - barbaraServices

  orchestrator:
    image: kikeramirez/home-assistant-orchestrator:latest
    networks:
      - barbaraServices

  doc-ingestion-worker:
    image: kikeramirez/home-assistant-doc-ingestion-worker:latest
    networks:
      - barbaraServices

# No `build:` here on purpose: on a Barbara node, these images are pulled
# ready-made from Docker Hub instead of built on the node itself. Build and
# push them with ./build-and-push-images.sh (repo root) before deploying —
# see the root README's "Publishing images to Docker Hub" section.
# docker-compose-local.yml is the one that still builds from Dockerfile.service
# directly, for local debugging.
#
# The MQTT broker (Mosquitto), Postgres, PostgREST, InfluxDB, and Grafana are
# NOT declared here: they're Barbara Marketplace services, already deployed
# on the node. Our services connect to them by hostname/Barbara's internal
# DNS over this same network (CLAUDE.md section 2).
#
# Secrets and appconfig aren't declared here either (no env_file, no
# volumes): on a Barbara node, the platform itself injects them
# (Secrets/AppConfig of the connector), same as the Industrial Data
# Simulator or the Marketplace's MQTT broker.
networks:
  barbaraServices:
    driver: bridge
    name: barbaraServices
