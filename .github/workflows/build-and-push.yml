name: Build and push service images

# Builds all 5 service images (same Dockerfile.service / build-arg pattern as
# build-and-push-images.sh) and pushes them to Docker Hub, one repo per
# service, on every push to main. workflow_dispatch lets you also trigger a
# rebuild by hand from the Actions tab without needing a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DOCKERHUB_USER: kikeramirez

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: telegram-adapter
            module: telegram_adapter
          - service: web-adapter
            module: web_adapter
          - service: orchestrator
            module: orchestrator
          - service: doc-ingestion-worker
            module: doc_ingestion_worker
          - service: doc-generation-worker
            module: doc_generation_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/home-assistant-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USER }}/home-assistant-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
