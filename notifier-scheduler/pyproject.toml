[project]
name = "notifier-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dateutil>=2.9",
    "aiomqtt>=2.1",
    "pydantic-settings>=2.3",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
