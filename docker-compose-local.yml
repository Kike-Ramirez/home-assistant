services:
  telegram-adapter:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: telegram-adapter
        MODULE: telegram_adapter
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    networks:
      - barbaraServices

  web-adapter:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: web-adapter
        MODULE: web_adapter
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    ports:
      - "8090:8090"
    networks:
      - barbaraServices

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: orchestrator
        MODULE: orchestrator
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    networks:
      - barbaraServices

  doc-ingestion-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: doc-ingestion-worker
        MODULE: doc_ingestion_worker
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    networks:
      - barbaraServices

  doc-generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: doc-generation-worker
        MODULE: doc_generation_worker
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    networks:
      - barbaraServices

  image-generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: image-generation-worker
        MODULE: image_generation_worker
    env_file:
      - barbarasecrets.env
    volumes:
      - ./appconfigDev:/appconfig
    networks:
      - barbaraServices

# The MQTT broker (Mosquitto), Postgres, PostgREST, InfluxDB, and Grafana are
# NOT declared here: they're Barbara Marketplace services, already deployed
# on the node. Our services connect to them by hostname/Barbara's internal
# DNS over this same network (CLAUDE.md section 2).
#
# barbarasecrets.env and appconfigDev/ (both at the repo root) are shared by
# every service here, on purpose: that's how Barbara Secrets and Appconfig
# actually work on a real node — one store per app/project, injected
# identically into every container, not one per docker-compose service. Each
# service's config.py only reads the top-level appconfig key (and the env
# vars) it actually needs; see shared/shared/settings.py and each service's
# README. This mirrors Barbara's own boilerplate exactly:
# https://github.com/Barbaraedge/training_barbara_apps_development/tree/main/boilerplate_01_python
networks:
  barbaraServices:
    driver: bridge
    name: barbaraServices
