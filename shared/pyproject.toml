[project]
name = "shared"
version = "0.1.0"
description = "MQTT message contract, PostgREST/internal HTTP clients, and common settings"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiomqtt>=2.1",
    "postgrest>=2.19",
    "anthropic>=0.34",
    "google-genai>=0.3",
    "httpx>=0.27",  # used directly by internal_client.py, not just transitively via postgrest
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
