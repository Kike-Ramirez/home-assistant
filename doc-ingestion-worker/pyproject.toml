[project]
name = "doc-ingestion-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "pydantic-settings>=2.3",
    "aiohttp>=3.9",  # /extract endpoint — no more MQTT, orchestrator calls this directly
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
