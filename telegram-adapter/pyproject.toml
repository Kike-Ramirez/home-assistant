[project]
name = "telegram-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "aiogram>=3.10",  # trae aiohttp como dependencia propia — no lo declaramos aparte
    "pydantic-settings>=2.3",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
