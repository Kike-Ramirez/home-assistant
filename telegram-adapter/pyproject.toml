[project]
name = "telegram-adapter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "aiogram>=3.10",  # brings aiohttp in as its own dependency — not declared separately here
    "pydantic-settings>=2.3",
    "httpx>=0.27",  # downloads an outbound attachment when it's a URL, not a data: URI
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
