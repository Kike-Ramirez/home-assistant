[project]
name = "doc-generation-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "pydantic-settings>=2.3",
    "aiohttp>=3.9",  # /generate endpoint — no MQTT, orchestrator calls this directly
    "fpdf2>=2.7",    # pure-Python PDF rendering, no system dependencies (no Pango/Cairo)
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
